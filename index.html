<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="description" content="三角形、正方形和圆形迷宫生成器" />
    <title>形状迷宫生成器</title>
    <link rel="stylesheet" href="./styles.css?v=9" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <p class="eyebrow">SHAPE MAZE LAB</p>
        <h1>把简单形状，变成一座迷宫。</h1>
        <p>选择轮廓和难度，每次生成一张拥有唯一解的迷宫。</p>
      </header>

      <section class="workspace">
        <form id="maze-form" class="control-panel">
          <fieldset>
            <legend>01 · 选择轮廓</legend>
            <div class="shape-options">
              <label class="shape-option">
                <input type="radio" name="shape" value="triangle" />
                <span class="shape-icon triangle" aria-hidden="true"></span>
                <strong>三角形</strong>
              </label>
              <label class="shape-option">
                <input type="radio" name="shape" value="square" />
                <span class="shape-icon square" aria-hidden="true"></span>
                <strong>正方形</strong>
              </label>
              <label class="shape-option">
                <input type="radio" name="shape" value="circle" checked />
                <span class="shape-icon circle" aria-hidden="true"></span>
                <strong>圆形</strong>
              </label>
            </div>
          </fieldset>

          <fieldset>
            <legend>02 · 选择难度</legend>
            <div class="segmented-control">
              <label><input type="radio" name="difficulty" value="easy" /><span>简单</span></label>
              <label><input type="radio" name="difficulty" value="medium" checked /><span>中等</span></label>
              <label><input type="radio" name="difficulty" value="hard" /><span>困难</span></label>
            </div>
          </fieldset>

          <fieldset>
            <legend>03 · 选择终点模式</legend>
            <div class="goal-options">
              <label>
                <input type="radio" name="goalMode" value="center" />
                <span><strong>中心终点</strong><small>从外部入口走到图形中心</small></span>
              </label>
              <label>
                <input type="radio" name="goalMode" value="through" checked />
                <span><strong>穿过迷宫</strong><small>从底部入口走到顶部出口</small></span>
              </label>
            </div>
          </fieldset>

          <fieldset>
            <legend>04 · 随机种子</legend>
            <div class="seed-row">
              <input id="seed" name="seed" type="number" min="0" max="4294967295" aria-label="随机种子" />
              <button id="reuse-seed" type="button" class="secondary">按种子重现</button>
            </div>
          </fieldset>

          <label class="toggle-row">
            <span>
              <strong>显示正确路线</strong>
              <small>橙色线条显示入口到目标的路线</small>
            </span>
            <input id="show-solution" type="checkbox" role="switch" />
          </label>

          <div class="actions">
            <button type="submit" class="primary">生成新迷宫</button>
            <button id="download-svg" type="button" class="secondary" disabled>下载带水印 SVG</button>
          </div>
        </form>

        <section class="preview-panel" aria-labelledby="preview-title">
          <div class="preview-heading">
            <div>
              <p class="eyebrow">LIVE PREVIEW</p>
              <h2 id="preview-title">迷宫预览</h2>
            </div>
            <p id="maze-stats" aria-live="polite"></p>
          </div>
          <div class="play-toolbar">
            <div class="game-mode-picker" role="radiogroup" aria-label="选择游戏模式">
              <label>
                <input type="radio" name="gameMode" value="classic" checked />
                <span><strong>经典闯关</strong><small>从入口直接找到目标</small></span>
              </label>
              <label>
                <input type="radio" name="gameMode" value="treasure" />
                <span><strong>取宝逃生</strong><small>先取中心宝物，再逃到出口</small></span>
              </label>
              <label>
                <input type="radio" name="gameMode" value="timeAttack" />
                <span><strong>计时挑战</strong><small>倒计时内到达目标，撞墙扣时</small></span>
              </label>
              <label>
                <input type="radio" name="gameMode" value="fog" />
                <span><strong>迷雾探索</strong><small>只显示附近和走过的区域</small></span>
              </label>
            </div>
            <div class="play-state" aria-live="polite">
              <strong id="play-status">准备闯关</strong>
              <small id="play-hint">从入口出发，找到橙色目标</small>
            </div>
            <div class="play-metrics" aria-label="闯关数据">
              <span><small id="time-label">时间</small><strong id="play-time">00:00</strong></span>
              <span><small>步数</small><strong id="play-moves">0</strong></span>
              <span><small>撞墙</small><strong id="play-collisions">0</strong></span>
            </div>
            <div class="play-actions">
              <button id="start-play" type="button" class="primary">开始闯关</button>
              <button id="stop-play" type="button" class="danger" disabled>终止游戏</button>
            </div>
          </div>
          <div id="maze-preview" class="maze-preview"></div>
          <p class="touch-hint">在迷宫画面上向任意方向滑动即可移动</p>
          <div class="preview-footer">
            <div class="legend">
              <span><i class="entrance-dot"></i>入口</span>
              <span><i class="goal-dot"></i>终点 / 出口</span>
              <span id="treasure-legend" hidden><i class="treasure-dot"></i>中心宝物</span>
              <span id="fog-legend" hidden><i class="fog-dot"></i>未探索区域</span>
            </div>
            <div class="direction-pad" aria-label="移动方向">
              <button type="button" data-direction="N" aria-label="向上移动">↑</button>
              <button type="button" data-direction="W" aria-label="向左移动">←</button>
              <button type="button" data-direction="S" aria-label="向下移动">↓</button>
              <button type="button" data-direction="E" aria-label="向右移动">→</button>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="./src/app.js?v=16"></script>
  </body>
</html>
